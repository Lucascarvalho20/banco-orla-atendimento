apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: orla
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: orla-web:dev
          ports:
            - containerPort: 3000
          env:
            - name: REALTIME_URL
              value: http://realtime:4000
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: orla
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
